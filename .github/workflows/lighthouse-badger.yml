# Audit this site's published pages and keep Lighthouse Badger reports/badges up to date.
# Uses GitHub's short-lived, repository-scoped GITHUB_TOKEN; no personal access token needed.
name: Lighthouse Badger

on:
  page_build:
  workflow_dispatch:
  # Run the updated workflow once when it is merged, without waiting for the next Pages build.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lighthouse-badger.yml"

permissions:
  contents: write

concurrency:
  group: lighthouse-badger
  cancel-in-progress: false

env:
  URLS: https://770122whrt.github.io/
  MOBILE_LIGHTHOUSE_PARAMS: "--only-categories=performance,accessibility,best-practices,seo --throttling.cpuSlowdownMultiplier=2"
  DESKTOP_LIGHTHOUSE_PARAMS: "--only-categories=performance,accessibility,best-practices,seo --preset=desktop --throttling.cpuSlowdownMultiplier=1"

jobs:
  lighthouse-badger-easy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set target branch for Lighthouse Badger
        run: |
          echo "BRANCH=main" >> "$GITHUB_ENV"
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main
          token: ${{ github.token }}
      - name: Checkout Lighthouse badges generator
        uses: actions/checkout@v7
        with:
          repository: myactionway/lighthouse-badges
          path: temp_lighthouse_badges_nested
          persist-credentials: false
      - name: Audit website and update reports
        uses: myactionway/lighthouse-badger-action@v2.2
        with:
          urls: ${{ env.URLS }}
          mobile_lighthouse_params: ${{ env.MOBILE_LIGHTHOUSE_PARAMS }}
          desktop_lighthouse_params: ${{ env.DESKTOP_LIGHTHOUSE_PARAMS }}
